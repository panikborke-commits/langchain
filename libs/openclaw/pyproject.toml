[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-openclaw"
description = "Global CLI tool for OpenClaw integration with LangChain"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

version = "0.0.1"
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.3.2,<2.0.0",
]

[project.scripts]
openclaw = "langchain_openclaw.cli:main"

[project.urls]
Homepage = "https://docs.langchain.com/"
Documentation = "https://reference.langchain.com/python/langchain_openclaw/"
Repository = "https://github.com/langchain-ai/langchain"
Issues = "https://github.com/langchain-ai/langchain/issues"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"

[dependency-groups]
dev = []

test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "pytest-watcher>=0.2.6,<1.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.6.0,<1.0.0",
    "pytest-xdist<4.0.0,>=3.6.1",
    "pytest-mock",
    "syrupy>=5.0.0,<6.0.0",
    "langchain-core",
]

lint = [
    "ruff>=0.15.0,<0.16.0",
]

typing = [
    "mypy>=1.18.1,<1.20.0",
]

[tool.uv]
constraint-dependencies = ["pygments>=2.20.0"]

[tool.uv.sources]
langchain-core = { path = "../core", editable = true }

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "ALL"
]
ignore = [
    "COM812",  # Messes with the formatter
    "ISC001",  # Messes with the formatter
    "PERF203", # Rarely useful
    "SLF001",  # Private member access
    "PLC0415", # Imports should be at the top
    "PLR0913", # Too many arguments
    "PLC0414", # Intentional re-exports
    "S101",    # Tests need assertions
    "PLR2004", # Magic numbers
    "ARG001",
    "D104",
    "FIX002",
    "TD002",
    "TD003",
    "T201",    # Allow print statements (CLI tool)
]
unfixable = ["B028"]

pyupgrade.keep-runtime-typing = true
flake8-annotations.allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 --snapshot-warn-unused -vv"
markers = [
    "requires: mark tests as requiring a specific library",
    "scheduled: mark tests to run in scheduled testing",
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
    "ignore::langchain_core._api.deprecation.LangChainDeprecationWarning:tests",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning:tests",
]

[tool.mypy]
strict = true
